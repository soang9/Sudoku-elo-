<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F2">
<title>Sudoku Elo</title>
<script>(function(){var h=location.hash;if(h==="#dark"||h==="#light")document.documentElement.setAttribute("data-theme",h.slice(1));})();</script>
<style>

@font-face { font-family: 'Fraunces'; src: url('fonts/fraunces.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('fonts/plex-sans-400.woff2') format('woff2'); font-weight: 400; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('fonts/plex-sans-500.woff2') format('woff2'); font-weight: 500; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('fonts/plex-sans-600.woff2') format('woff2'); font-weight: 600; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('fonts/plex-mono-400.woff2') format('woff2'); font-weight: 400; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('fonts/plex-mono-500.woff2') format('woff2'); font-weight: 500; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('fonts/plex-mono-600.woff2') format('woff2'); font-weight: 600; font-display: block; }
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* Layout idea: a tournament scoresheet. Ink on cool paper, the rating set huge in a soft serif, everything else quiet and tabular. */
:root {
  --paper: #EEF0F2;
  --surface: #FFFFFF;
  --ink: #131A23;
  --muted: #5B6673;
  --line: #CDD3DA;
  --accent: #2847D0;
  --accent-soft: #DCE2FA;
  --peer: #E6E9EE;
  --good: #16805A;
  --warn: #B26B12;
  --bad: #C1362C;
  --violet: #7446C4;
  --hint: #8A939E;
  --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1318; --surface: #171E26; --ink: #E7EBEF; --muted: #93A0AD; --line: #2B3540;
    --accent: #8EA2FF; --accent-soft: #24305C; --peer: #1E2731;
    --good: #4CC795; --warn: #E2A24C; --bad: #FF7A6E; --violet: #B795F2; --hint: #6F7B87;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1318; --surface: #171E26; --ink: #E7EBEF; --muted: #93A0AD; --line: #2B3540;
  --accent: #8EA2FF; --accent-soft: #24305C; --peer: #1E2731;
  --good: #4CC795; --warn: #E2A24C; --bad: #FF7A6E; --violet: #B795F2; --hint: #6F7B87;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.screen { max-width: 560px; margin: 0 auto; padding: 12px 16px 28px; min-height: 100%; }
.screen[hidden] { display: none; }

/* ---------- top bars ---------- */
.bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.bar .grow { flex: 1; min-width: 0; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); display: inline-grid; place-items: center; flex: none;
}
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { font: 500 11px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- home ---------- */
.hero { padding: 18px 0 8px; display: grid; gap: 4px; }
.elo-big {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(76px, 24vw, 112px);
  line-height: .9; letter-spacing: -.035em; font-variation-settings: "opsz" 144;
  font-variant-numeric: tabular-nums lining-nums;
}
.hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.rank { font: 600 13px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; }
.rank .prov { color: var(--warn); }
.spark { width: 120px; height: 44px; flex: none; }
.hero-meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font: 13px var(--f-mono); }
.hero-meta b { color: var(--ink); font-weight: 600; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--peer); border-radius: 12px; padding: 3px; margin: 16px 0 6px; }
.seg button { border: 0; background: transparent; padding: 9px 8px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg-note { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

.primary {
  width: 100%; border: 0; border-radius: 14px; background: var(--ink); color: var(--paper);
  padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
}
.primary .t { display: block; font: 600 17px/1.2 var(--f-body); }
.primary .s { display: block; font: 12px/1.3 var(--f-mono); opacity: .75; margin-top: 3px; }
.primary .arrow { font: 600 22px var(--f-display); }
.resume { background: var(--accent); color: #fff; margin-bottom: 10px; }

.section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 8px; }
.levels { display: grid; gap: 0; border-top: 1px solid var(--line); }
.lvl {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center;
  padding: 13px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%;
}
.lvl .pips { display: grid; grid-template-columns: repeat(5, 4px); gap: 2px; align-items: end; height: 18px; }
.lvl .pips i { display: block; width: 4px; background: var(--line); border-radius: 1px; }
.lvl .pips i.on { background: var(--ink); }
.lvl .name { font: 600 16px/1.2 var(--f-body); display: flex; gap: 8px; align-items: center; }
.lvl .rec { font: 600 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; padding: 3px 5px; border-radius: 4px; }
.lvl .sub { font: 12px/1.4 var(--f-mono); color: var(--muted); margin-top: 2px; }
.lvl .stake { text-align: right; font: 12px/1.35 var(--f-mono); }
.lvl .stake .up { color: var(--good); }
.lvl .stake .down { color: var(--bad); }
.linkrow { margin-top: 18px; display: flex; gap: 10px; }
.ghost { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-weight: 600; }

/* ---------- game ---------- */
#screen-game { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; }
#screen-game .tools { margin-top: auto; }
#screen-game[hidden] { display: none; }
.gtitle { font: 600 15px/1.2 var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gsub { font: 12px/1.2 var(--f-mono); color: var(--muted); }
.stats { display: flex; justify-content: space-between; align-items: center; font: 13px var(--f-mono); color: var(--muted); padding: 0 2px; }
.stats b { color: var(--ink); font-weight: 600; }
.stats .x { letter-spacing: .1em; }
.stats .x .hit { color: var(--bad); }
.timer { font: 600 16px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }

.board-wrap { position: relative; align-self: center; width: min(100%, calc(100vh - 330px), 540px); width: min(100%, calc(100dvh - 330px), 540px); min-width: 260px; }
.board {
  container-type: inline-size;
  display: grid; grid-template-columns: repeat(9, 1fr); aspect-ratio: 1;
  background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
.cell {
  position: relative; display: grid; place-items: center; border: 0; padding: 0; background: transparent;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-family: var(--f-display); font-variation-settings: "opsz" 72; font-size: 6.6cqw; line-height: 1;
}
.cell:nth-child(9n) { border-right: 0; }
.cell:nth-child(9n+3), .cell:nth-child(9n+6) { border-right: 2px solid var(--ink); }
.cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--ink); }
.cell:nth-child(n+73) { border-bottom: 0; }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--accent-soft); }
.cell.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.cell.given { font-weight: 600; color: var(--ink); }
.cell.user { font-weight: 400; color: var(--accent); }
.cell.wrong { color: var(--bad); font-weight: 400; }
.cell.wrong::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 14%; height: 2px; background: var(--bad); border-radius: 1px; }
.cell.flash { animation: flash .6s ease-out; }
.cell.shake { animation: shake .35s; }
.cell.hl { box-shadow: inset 0 0 0 2px var(--violet); }
@keyframes flash { 0% { background: var(--accent); } 100% { } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; padding: 6%; }
.notes span { display: grid; place-items: center; font: 500 2.3cqw/1 var(--f-mono); color: var(--muted); }
.notes span.m { color: #fff; background: var(--accent); border-radius: 3px; }

.pause-veil {
  position: absolute; inset: 0; background: var(--surface); border: 2px solid var(--ink); border-radius: 6px;
  display: grid; place-content: center; gap: 10px; text-align: center; padding: 20px;
}
.pause-veil[hidden] { display: none; }
.pause-veil .big { font: 800 34px/1 var(--f-display); }
.pause-veil button { min-width: 220px; }

.hintbar {
  border-left: 3px solid var(--violet); background: var(--surface); padding: 9px 12px; border-radius: 0 10px 10px 0;
  font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
}
.hintbar[hidden] { display: none; }
.hintbar p { margin: 0; flex: 1; }
.hintbar button { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 4px; }

.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tool { border: 0; background: transparent; display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font: 500 12px var(--f-body); position: relative; }
.tool svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool .badge { position: absolute; top: 0; right: calc(50% - 22px); font: 600 10px/1 var(--f-mono); padding: 3px 4px; border-radius: 4px; background: var(--peer); color: var(--muted); }
.tool[aria-pressed="true"] .badge { background: var(--accent); color: #fff; }
.tool[aria-pressed="true"] { color: var(--accent); }
.tool[aria-pressed="true"] svg { stroke: var(--accent); }

.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
.key {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 0 6px;
  display: grid; justify-items: center; gap: 2px;
}
.key .d { font: 600 26px/1 var(--f-display); color: var(--accent); font-variation-settings: "opsz" 72; }
.key .r { font: 10px/1 var(--f-mono); color: var(--muted); }
.key:disabled { visibility: hidden; }
.notes-on .key .d { font: 500 19px/1.37 var(--f-mono); color: var(--muted); }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10,14,20,.45); display: grid; align-items: end; justify-items: center; z-index: 20; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
.overlay[hidden] { display: none; }
.sheet { width: 100%; max-width: 520px; background: var(--surface); border-radius: 18px; padding: 22px 20px 18px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet h2 { font: 800 30px/1.05 var(--f-display); letter-spacing: -.01em; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .btns { display: grid; gap: 8px; }
.sheet .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 13px; font-weight: 600; }
.btn.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.danger { color: var(--bad); }
.elo-move { display: flex; align-items: baseline; gap: 12px; font-family: var(--f-display); }
.elo-move .from { font-size: 22px; color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.elo-move .to { font-size: 48px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.elo-move .d { font: 600 16px var(--f-mono); }
.up { color: var(--good); } .down { color: var(--bad); }
.loading { align-items: center; }
.loading .sheet { text-align: center; justify-items: center; }
.spinner { width: 54px; height: 54px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.spinner i { background: var(--ink); border-radius: 2px; animation: blink 1.2s infinite; }
.spinner i:nth-child(2n) { animation-delay: .2s; } .spinner i:nth-child(3n) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: 90vw; }
.toast[hidden] { display: none; }

/* ---------- analysis & history ---------- */
.a-head { padding: 10px 0 6px; display: grid; gap: 4px; }
.a-head h1 { font: 800 40px/1 var(--f-display); letter-spacing: -.02em; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); margin: 12px 0 4px; }
.tile { padding: 12px 8px 12px 0; display: grid; gap: 2px; }
.tile + .tile { padding-left: 12px; border-left: 1px solid var(--line); }
.tile .v { font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .k { font: 11px/1.2 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tile .s { font: 12px/1.3 var(--f-mono); color: var(--muted); }
.block { margin-top: 26px; display: grid; gap: 10px; }
.block h2 { font: 700 20px/1.2 var(--f-display); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.block h2 small { font: 12px var(--f-mono); color: var(--muted); font-weight: 400; }
.block p { margin: 0; }
.muted { color: var(--muted); }
.perf { display: grid; gap: 6px; font: 13px/1.4 var(--f-mono); }
.perf .line { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.meter { position: relative; height: 10px; background: var(--peer); border-radius: 5px; margin: 6px 0 2px; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--ink); }
.meter .exp { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--accent); }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--peer); }
.stack i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; }
.legend div { display: flex; gap: 8px; align-items: baseline; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; transform: translateY(1px); }
.legend b { font-family: var(--f-mono); margin-left: auto; }
.c-obvious { background: var(--good); fill: var(--good); }
.c-ahead { background: var(--accent); fill: var(--accent); }
.c-technique { background: var(--violet); fill: var(--violet); }
.c-risky { background: var(--warn); fill: var(--warn); }
.c-error { background: var(--bad); fill: var(--bad); }
.c-hint { background: var(--hint); fill: var(--hint); }
.t-obvious { color: var(--good); } .t-ahead { color: var(--accent); } .t-technique { color: var(--violet); }
.t-risky { color: var(--warn); } .t-error { color: var(--bad); } .t-hint { color: var(--hint); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 10px var(--f-mono); fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .avg { stroke: var(--ink); stroke-dasharray: 3 3; stroke-width: 1; }
.moments { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.moments li { background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; border-left: 3px solid var(--line); }
.moments li.k-error { border-left-color: var(--bad); }
.moments li.k-pause { border-left-color: var(--warn); }
.moments .h { font: 600 12px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.replay { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.mini { width: min(100%, 340px); justify-self: center; }
.mini .cell { font-size: 6.4cqw; }
.mini .cell.mv { box-shadow: inset 0 0 0 3px currentColor; }
.replay-ctl { display: flex; gap: 8px; align-items: center; }
.replay-ctl input { flex: 1; accent-color: var(--accent); }
.caption { font-size: 14px; min-height: 42px; }
.techs { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.techs li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.techs li .d { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.techs b { font-weight: 600; }
.techs .n { font-family: var(--f-mono); color: var(--muted); }
.advice { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.table th { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.table td.r, .table th.r { text-align: right; font-variant-numeric: tabular-nums; }
.glist { display: grid; border-top: 1px solid var(--line); }
.grow-btn { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.grow-btn .a { font-weight: 600; }
.grow-btn .b { font: 12px var(--f-mono); color: var(--muted); }
.grow-btn .c { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 600 15px var(--f-mono); }
.empty { color: var(--muted); padding: 14px 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-height: 640px) { .key { padding: 5px 0 4px; } .key .d { font-size: 22px; } .tool { padding: 3px 0; } }

/* ---------- platform additions ---------- */
:root { --brill: #148F8A; --exc: #2E8B3A; --okc: #6B9A3A; --tabh: 62px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --brill: #3FD0C8; --exc: #5CCB6B; --okc: #A5CF6B; } }
:root[data-theme="dark"] { --brill: #3FD0C8; --exc: #5CCB6B; --okc: #A5CF6B; }
body.has-tabs .screen { padding-bottom: calc(var(--tabh) + 24px + env(safe-area-inset-bottom)); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface);
  border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar[hidden] { display: none; }
.tabbar button { border: 0; background: transparent; height: var(--tabh); display: grid; justify-items: center; align-content: center; gap: 3px; font: 500 11px var(--f-body); color: var(--muted); }
.tabbar svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.2; }

.topline { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.wordmark { font: 800 24px/1 var(--f-display); letter-spacing: -.02em; flex: 1; }

<script>
var ENGINE = (function () {
  'use strict';
  const ROW = [], COL = [], BOX = [];
  for (let i = 0; i < 81; i++) {
    ROW[i] = (i / 9) | 0; COL[i] = i % 9;
    BOX[i] = ((ROW[i] / 3) | 0) * 3 + ((COL[i] / 3) | 0);
  }
  const UNITS = [];
  for (let r = 0; r < 9; r++) { const u = []; for (let c = 0; c < 9; c++) u.push(r * 9 + c); UNITS.push(u); }
  for (let c = 0; c < 9; c++) { const u = []; for (let r = 0; r < 9; r++) u.push(r * 9 + c); UNITS.push(u); }
  for (let b = 0; b < 9; b++) {
    const u = [], br = ((b / 3) | 0) * 3, bc = (b % 3) * 3;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) u.push((br + r) * 9 + bc + c);
    UNITS.push(u);
  }
  const PEERS = [], ISPEER = new Uint8Array(81 * 81);
  for (let i = 0; i < 81; i++) {
    const s = new Set();
    [ROW[i], 9 + COL[i], 18 + BOX[i]].forEach(ui => UNITS[ui].forEach(p => { if (p !== i) s.add(p); }));
    PEERS[i] = Array.from(s);
    PEERS[i].forEach(p => { ISPEER[i * 81 + p] = 1; });
  }
  const POP = new Uint8Array(512), LOWDIG = new Uint8Array(512);
  for (let m = 1; m < 512; m++) {
    let n = 0; for (let k = 0; k < 9; k++) if (m & (1 << k)) n++;
    POP[m] = n;
    for (let k = 0; k < 9; k++) if (m & (1 << k)) { LOWDIG[m] = k + 1; break; }
  }
  const digitsOf = m => { const a = []; for (let k = 0; k < 9; k++) if (m & (1 << k)) a.push(k + 1); return a; };
  let rand = Math.random;
  function setRng(f) { rand = f || Math.random; }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function seedFrom(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

  const TECH = {
    nakedSingle:  { name: 'Singleton nu',          level: 1, cost: 1 },
    hiddenSingle: { name: 'Singleton caché',       level: 1, cost: 2 },
    pointing:     { name: 'Paire pointante',       level: 2, cost: 6 },
    boxLine:      { name: 'Réduction bloc/ligne',  level: 2, cost: 6 },
    nakedPair:    { name: 'Paire nue',             level: 2, cost: 7 },
    hiddenPair:   { name: 'Paire cachée',          level: 2, cost: 9 },
    nakedTriple:  { name: 'Triplet nu',            level: 3, cost: 11 },
    hiddenTriple: { name: 'Triplet caché',         level: 3, cost: 13 },
    xwing:        { name: 'X-Wing',                level: 3, cost: 15 },
    ywing:        { name: 'Y-Wing',                level: 3, cost: 18 },
    swordfish:    { name: 'Swordfish',             level: 4, cost: 25 },
    nakedQuad:    { name: 'Quadruplet nu',         level: 4, cost: 22 }
  };
  const LEVELS = [
    { key: 'facile',     name: 'Facile',     base: 600,  span: 300, par: 300 },
    { key: 'moyen',      name: 'Moyen',      base: 900,  span: 300, par: 540 },
    { key: 'difficile',  name: 'Difficile',  base: 1200, span: 300, par: 900 },
    { key: 'expert',     name: 'Expert',     base: 1500, span: 300, par: 1320 },
    { key: 'diabolique', name: 'Diabolique', base: 1800, span: 400, par: 1800 }
  ];

  // ---------- Backtracking ----------
  function solveCount(grid, limit) {
    const g = grid.slice();
    const rows = new Int32Array(9), cols = new Int32Array(9), boxes = new Int32Array(9);
    for (let i = 0; i < 81; i++) {
      const v = g[i];
      if (v) {
        const bit = 1 << (v - 1);
        if ((rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & bit) return { count: 0, sol: null };
        rows[ROW[i]] |= bit; cols[COL[i]] |= bit; boxes[BOX[i]] |= bit;
      }
    }
    let count = 0, sol = null;
    const rec = () => {
      let best = -1, bestM = 0, bestC = 10;
      for (let i = 0; i < 81; i++) {
        if (g[i]) continue;
        const m = ~(rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & 511;
        const c = POP[m];
        if (c < bestC) { bestC = c; best = i; bestM = m; if (c <= 1) break; }
      }
      if (best < 0) { count++; if (!sol) sol = g.slice(); return; }
      if (bestC === 0) return;
      const r = ROW[best], c = COL[best], bx = BOX[best];
      let m = bestM;
      while (m) {

  function randomSolution() {
    const g = new Array(81).fill(0);
    const rows = new Int32Array(9), cols = new Int32Array(9), boxes = new Int32Array(9);
    const rec = () => {
      let best = -1, bestM = 0, bestC = 10;
      for (let i = 0; i < 81; i++) {
        if (g[i]) continue;

    for (const u of order) {

  function pointing(cand) {

  }

  function boxLine(cand) {

  }

  function combos(arr, k, fn) {
    const idx = [];
    const rec = (start, depth) => {
      if (depth === k) return fn(idx.map(j => arr[j]));

      for (let x = 0; x < wings.length; x++) for (let y = x + 1; y < wings.length; y++) {

      case 0: frac = (42 - givens) / 7; break;
      case 1: frac = 0.5 * (35 - givens) / 9 + 0.5 * Math.min(1, 1.6 * hs / Math.max(1, 81 - givens)); break;

  }

    ROW, COL, BOX, UNITS, PEERS, ISPEER, POP, LOWDIG, TECH, LEVELS,
    digitsOf, solveCount, randomSolution, makePuzzle, computeCands, placeVal,
    findSingles, nextStep, nextElim, applyStep, isPlacement, solveLogic, grade,

  let gcells = null, gkeys = null, paused = false, hlCells = [];

  function describeElim(st) {

  function describeAnswer(a) {

  function problemDigit(d) {

  function analyse(g) {
    const solA = toArr(g.solution);
    let prevT = 0;
    const rows = g.moves.map((m, k) => {
      const b = toArr(m.b), dt = Math.max(0, (m.t - prevT) / 1000); prevT = m.t;
      const corr = b.map((v, i) => (v === solA[i] ? v : 0));

      const r = { k, m, dt, singles, b, corr };

      if (!m.ok) { r.cls = 'blunder'; const c = E.PEERS[m.c].find(p => b[p] === m.v); r.conflict = c === undefined ? -1 : c; return r; }
      const rd = E.reachDepth(corr, m.c); r.rd = rd;
      if (rd.depth === Infinity || rd.depth >= 3) r.cls = 'inacc';

      else if (rd.depth === 0) r.cls = 'good';
      else r.cls = 'excellent';

  function timeChart(rows, avg) {

    for (let i = 0; i < 81; i++) {
      const v = arr[i]; let c = 'cell';
      if (puzzle[i] !== '0') c += ' given'; else if (v && v !== solA[i]) c += ' wrong'; else if (v) c += ' user';
      if (i === mv) c += ' mv t-' + cls;
      h += '<div class="' + c + '">' + (v || '') + '</div>';
    }
    return h + '</div>';
  }
  let replay = null;
  function openReview(id) {
    closeModal();
    const g = games[id], box = $('#analysis');
    if (!g) { box.innerHTML = '<p class="empty">Ce bilan n\'est plus disponible.</p>'; show('review'); return; }
    const L = LV[g.level], A = analyse(g), rows = A.rows, played = rows.filter(r => !r.m.h);
    const P = perfParts(g.won, g.time, L.par, g.mistakes, g.hints), avg = rows.length ? g.time / rows.length : 0;
    const accTxt = A.acc.toFixed(1).replace('.', ',');
    const coach = A.acc >= 95 ? 'Partie de très haut niveau : presque chaque coup était démontrable au moment où tu l\'as joué.' :
      A.acc >= 85 ? 'Solide. Quelques coups joués trop tôt, mais ta lecture de grille tient la route.' :
      A.acc >= 70 ? 'Correct, mais trop de coups joués sans preuve. Ralentis et note les candidats.' :
      'Beaucoup de paris et d\'erreurs. Reviens sur les leçons de base et entraîne-toi sur les problèmes.';
    const modeName = g.mode === 'duel' && g.opp ? 'Duel contre ' + g.opp.name + ' (' + g.opp.rating + ')' : g.mode === 'daily' ? 'Grille du jour' : g.mode === 'free' ? 'Partie libre' : 'Partie classée';
    let h = '<div class="a-head"><span class="eyebrow">' + modeName + ' · ' + L.name + ' · ' + dateStr(g.date) + '</span><h1>' + (g.won ? 'Victoire' : 'Défaite') + ' en ' + fmt(g.time) + '</h1></div>';
    h += '<section class="block"><div class="acc"><span class="v">' + accTxt + '</span><span class="eyebrow">Précision</span></div>' +
      '<div class="coach"><span class="avatar sm" style="background:var(--accent)">C</span><div class="bubble">' + coach + '</div></div></section>';
    h += '<div class="tiles"><div class="tile"><span class="k">Temps</span><span class="v num">' + Math.round(P.ratio * 100) + ' %</span><span class="s">de la réf. ' + fmt(L.par) + '</span></div>' +
      '<div class="tile"><span class="k">Erreurs</span><span class="v num">' + g.mistakes + '</span><span class="s">' + plural(g.hints, 'indice') + '</span></div>' +
      '<div class="tile"><span class="k">Elo</span><span class="v num ' + dcls(g.delta || 0) + '">' + (g.mode === 'solo' || g.mode === 'duel' ? signed(g.delta) : '—') + '</span><span class="s">' + (g.mode === 'solo' || g.mode === 'duel' ? g.before + ' → ' + g.after : 'non classée') + '</span></div></div>';
    h += '<section class="block"><h2>Coups <small>' + rows.length + '</small></h2><table class="cls-table"><tbody>' +
      ORDER.map(c => '<tr><td><span class="sym c-' + c + '">' + CLS[c].sym + '</span>' + CLS[c].name + ' <span class="muted" style="font-size:12px">· ' + CLS[c].desc + '</span></td><td class="r t-' + c + '">' + A.counts[c] + '</td></tr>').join('') + '</tbody></table></section>';
    if (g.mode === 'solo') h += '<section class="block"><h2>Performance <small>score ' + P.S.toFixed(2) + ' · attendu ' + g.E.toFixed(2) + '</small></h2><div class="meter"><div class="fill" style="width:' + (P.S * 100) + '%"></div><div class="exp" style="left:calc(' + (g.E * 100) + '% - 1px)"></div></div><p class="xp">Variation = K ' + g.K + ' × (score − attendu). Le score combine temps (× ' + P.timeF.toFixed(2) + '), erreurs (−0,12 chacune) et indices (−0,15 chacun).</p></section>';
    if (g.mode === 'duel' && g.opp) h += '<section class="block"><h2>Duel</h2><p>' + (g.won ? 'Tu as fini en ' + fmt(g.time) + ', ' + g.opp.name + ' visait ' + fmt(g.opp.time) + '.' : g.reason === 'bot' ? g.opp.name + ' a fini en ' + fmt(g.opp.time) + '.' : 'Partie perdue avant la fin.') + ' Probabilité de victoire attendue : ' + Math.round(g.E * 100) + ' %.</p></section>';
    h += '<section class="block"><h2>Rythme <small>moyenne ' + fmtLong(avg) + ' / case</small></h2>' + timeChart(rows, avg) + '</section>';
    // key moments
    const moments = [];
    const pauses = played.slice().sort((a, b) => b.dt - a.dt).filter(r => r.dt >= Math.max(15, avg * 2)).slice(0, 3);
    pauses.forEach(r => {
      const m = r.m, s = r.singles;
      let txt = 'Tu as cherché ' + fmtLong(r.dt) + ' avant de jouer le ' + m.v + ' en ' + cellName(m.c) + '. ';
      if (s.length) {
        const ex = s.find(x => x.cell !== m.c), already = s.some(x => x.cell === m.c);
        txt += (already ? 'Ce coup était évident, et ' : 'Pendant ce temps, ') + s.length + (s.length > 1 ? ' cases évidentes étaient disponibles' : ' case évidente était disponible') + (ex ? ', par exemple le ' + ex.digit + ' en ' + cellName(ex.cell) : '') + '.';
      } else {
        const st = E.nextElim(E.computeCands(r.corr));
        txt += st ? 'Position bloquée : la clé était une ' + techName(st.t) + '.' : 'Position bloquée : il fallait un raisonnement en chaîne.';
      }
      moments.push({ k: r.k, kind: 'pause', h: 'Hésitation · coup ' + (r.k + 1), txt });
    });
    rows.filter(r => r.cls === 'blunder').forEach(r => moments.push({ k: r.k, kind: 'error', h: 'Gaffe · coup ' + (r.k + 1), txt: r.m.v + ' en ' + cellName(r.m.c) + ', il fallait ' + A.solA[r.m.c] + '. ' + (r.conflict >= 0 ? 'Le ' + r.m.v + ' était déjà visible en ' + cellName(r.conflict) + '.' : 'Aucun conflit visible : c\'était un pari.') }));
    moments.sort((a, b) => a.k - b.k);
    h += '<section class="block"><h2>Moments clés</h2>' + (moments.length ? '<ul class="moments">' + moments.map(x => '<li class="k-' + x.kind + '"><span class="h">' + x.h + '</span><span>' + x.txt + '</span></li>').join('') + '</ul>' : '<p class="muted">Aucune longue hésitation ni gaffe.</p>') + '</section>';
    h += '<section class="block"><h2>Revoir la partie</h2><div class="replay"><div id="rp-board"></div><div class="replay-ctl"><button class="iconbtn" id="rp-prev" aria-label="Coup précédent"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><input type="range" id="rp-range" min="0" max="' + rows.length + '" value="' + rows.length + '" aria-label="Position dans la partie"><button class="iconbtn" id="rp-next" aria-label="Coup suivant"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div><div class="caption" id="rp-cap"></div></div></section>';
    const counts = g.grade.counts || {}, techKeys = Object.keys(E.TECH).filter(t => counts[t]);
    if (!g.grade.solved) techKeys.push('chain');
    h += '<section class="block"><h2>Techniques de la grille</h2><ul class="techs">' + techKeys.map(t => '<li><b>' + (t === 'chain' ? 'Raisonnement en chaîne' : techName(t)) + '</b><span class="n">' + (t === 'chain' ? g.grade.remaining + ' cases' : '× ' + counts[t]) + '</span><span class="d">' + TECH_HELP[t] + '</span></li>').join('') + '</ul></section>';
    h += '<section class="block"><div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn dark" id="a-again">' + (g.mode === 'duel' ? 'Revanche' : 'Rejouer') + '</button><button class="btn" id="a-home">Accueil</button></div></section>';
    box.innerHTML = h;
    replay = { g, A, rows };
    const range = $('#rp-range'), draw = () => drawReplay(+range.value);
    range.addEventListener('input', draw);
    $('#rp-prev').addEventListener('click', () => { range.value = Math.max(0, +range.value - 1); draw(); });
    $('#rp-next').addEventListener('click', () => { range.value = Math.min(rows.length, +range.value + 1); draw(); });
    $('#a-again').addEventListener('click', () => g.mode === 'duel' && g.opp ? requestGame({ mode: 'duel', bot: g.opp.id }) : g.mode === 'daily' ? goTab('home') : requestGame({ mode: g.mode === 'free' ? 'free' : 'solo', level: g.level }));
    $('#a-home').addEventListener('click', () => goTab('home'));
    draw(); show('review');
  }
  function drawReplay(pos) {
    const { g, A, rows } = replay;
    let board, mv = -1, cls = '', capHtml;
    if (pos === 0) { board = toArr(g.puzzle); capHtml = '<span class="muted">Position de départ · ' + g.grade.givens + ' chiffres donnés.</span>'; }
    else {
      const r = rows[pos - 1]; board = r.b.slice(); board[r.m.c] = r.m.v; mv = r.m.c; cls = r.cls;
      const d = describeMove(r);
      capHtml = '<span class="sym c-' + cls + '">' + CLS[cls].sym + '</span><b class="t-' + cls + '">' + CLS[cls].name + '</b> · ' + d.head + '<br><span class="muted">' + d.body + '</span>';
    }
    $('#rp-board').innerHTML = miniBoard(board, A.solA, g.puzzle, mv, cls);
    $('#rp-cap').innerHTML = capHtml;
  }

  // ================= ticker =================
  let lastTick = performance.now(), saveTick = 0;
  setInterval(() => {
    const now = performance.now(), dt = now - lastTick; lastTick = now;
    const visible = document.visibilityState === 'visible' && $('#modal').hidden;
    if (screen === 'game' && cur && !cur.finished && !paused && visible) {
      cur.elapsed += dt; renderTime();
      if (cur.mode === 'duel') { renderDuel(); if (botProgress(cur) >= cur.bot.empties) { endGame(false, { reason: 'bot' }); return; } }
      if (now - saveTick > 5000) { saveTick = now; saveCur(); }
    }
    if (screen === 'rush' && rush && rush.running && visible && !rush.lock) {
      rush.left -= dt;
      if (rush.left <= 0) { rush.left = 0; renderRush(); endRush(); return; }
      const s = Math.ceil(rush.left / 1000);
      $('#r-clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      $('#r-clock').classList.toggle('low', s <= 20);
    }
  }, 200);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && screen === 'game' && cur && !cur.finished) setPause(true); });

  // ================= wiring =================
  function backFrom(s) {
    if (s === 'game') { saveCur(); goTab(cur && cur.mode === 'duel' ? 'play' : tab); }
    else if (s === 'problem') goTab(prob && prob.opts.mode === 'practice' ? 'learn' : prob && prob.opts.mode === 'daily' ? 'home' : 'puzzles');
    else if (s === 'rush') { if (rush && rush.running) modal('<h2>Quitter le Rush ?</h2><p>Ton score actuel (' + rush.score + ') sera enregistré.</p><div class="btns"><button class="btn danger" data-act="ok">Terminer maintenant</button><button class="btn" data-act="no">Continuer</button></div>', { ok: endRush }); else goTab('puzzles'); }
    else if (s === 'lesson') goTab('learn');
    else if (s === 'review') goTab(tab);
    else goTab('home');
  }
  function wire() {
    gcells = makeBoard($('#board'), selectCell); gkeys = makePad($('#pad'), inputDigit);
    pcells = makeBoard($('#pboard'), i => { if (!prob || prob.answered) return; prob.sel = i; renderProblem(); }); pkeys = makePad($('#ppad'), problemDigit);
    rcells = makeBoard($('#rboard'), i => { if (!rush || !rush.running) return; rush.sel = i; renderRush(); }); rkeys = makePad($('#rpad'), rushDigit);
    document.querySelectorAll('#tabbar button').forEach(b => b.addEventListener('click', () => goTab(b.dataset.tab)));
    $('#g-back').addEventListener('click', () => backFrom('game'));
    $('#g-pause').addEventListener('click', () => setPause(!paused));
    $('#v-resume').addEventListener('click', () => setPause(false));
    $('#v-abandon').addEventListener('click', () => modal('<h2>Abandonner ?</h2><p>' + (cur && (cur.mode === 'solo' || cur.mode === 'duel') ? 'La partie compte comme une défaite et ton Elo baisse.' : 'La partie sera enregistrée comme une défaite.') + '</p><div class="btns"><button class="btn danger" data-act="ok">Abandonner</button><button class="btn" data-act="no">Continuer à jouer</button></div>',
      { ok: () => { paused = false; $('#veil').hidden = true; endGame(false, { reason: 'abandon' }); } }));
    $('#t-undo').addEventListener('click', undo);
    $('#t-erase').addEventListener('click', erase);
    $('#t-notes').addEventListener('click', toggleNotes);
    $('#t-hint').addEventListener('click', useHint);
    $('#hintclose').addEventListener('click', () => { hideHint(); if (cur) renderGame(); });
    $('#p-back').addEventListener('click', () => backFrom('problem'));
    $('#p-cands').addEventListener('click', () => { if (!prob) return; prob.showCands = !prob.showCands; profile.cands = prob.showCands; saveProfile(); renderProblem(); });
    $('#r-back').addEventListener('click', () => backFrom('rush'));
    $('#r-cands').addEventListener('click', () => { if (!rush) return; rush.cands = !rush.cands; profile.rushCands = rush.cands; renderRush(); });
    $('#a-back').addEventListener('click', () => backFrom('review'));
    $('#l-back').addEventListener('click', () => backFrom('lesson'));
    document.addEventListener('keydown', e => {
      if (!$('#modal').hidden) return;
      const dig = e.key >= '1' && e.key <= '9' ? +e.key : 0;
      if (screen === 'problem' && dig) { problemDigit(dig); return; }
      if (screen === 'rush' && dig) { rushDigit(dig); return; }
      if (screen !== 'game' || !cur) return;
      if (dig) { inputDigit(dig); e.preventDefault(); }
      else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { erase(); e.preventDefault(); }
      else if (e.key === 'n' || e.key === 'N') toggleNotes();
      else if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { undo(); e.preventDefault(); }
      else if (e.key.indexOf('Arrow') === 0) {
        let s = cur.selected < 0 ? 40 : cur.selected; const r = E.ROW[s], c = E.COL[s];
        if (e.key === 'ArrowUp') s = ((r + 8) % 9) * 9 + c;
        if (e.key === 'ArrowDown') s = ((r + 1) % 9) * 9 + c;
        if (e.key === 'ArrowLeft') s = r * 9 + (c + 8) % 9;
        if (e.key === 'ArrowRight') s = r * 9 + (c + 1) % 9;
        selectCell(s); e.preventDefault();
      }
    });
  }

  // Android wrapper hooks
  window.__androidBack = function () {
    if (!$('#loading').hidden) return true;
    if (!$('#modal').hidden) { closeModal(); if (screen === 'game' && !cur) goTab('home'); return true; }
    if (screen === 'game' && paused) { setPause(false); return true; }
    if (screen === 'home') return false;
    backFrom(screen); return true;
  };
  window.__androidPause = function () {
    if (screen === 'game' && cur && !cur.finished) setPause(true);
    saveCur(); saveProfile();
  };

  function start(data) {
    if (data && data.profile && !store.get('profile', null)) { profile = migrate(data.profile); games = data.games || {}; cur = data.cur || null; ranked = data.ranked !== false; }
    wire(); goTab('home');
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
</body>
</html>
